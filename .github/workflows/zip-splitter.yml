name: Build ZIP Splitter
on:
  push:
    branches: ['codex/zip-splitter-20261020']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Verify splitting engine
        run: |
          mkdir -p /tmp/splitter-tests
          javac -d /tmp/splitter-tests zip-splitter/app/src/main/java/com/shelby/zipsplitter/Splitter.java zip-splitter/tests/SplitterTest.java
          java -cp /tmp/splitter-tests com.shelby.zipsplitter.SplitterTest
      - name: Build APK
        working-directory: zip-splitter
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ZIP-Splitter-APK
          path: zip-splitter/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
