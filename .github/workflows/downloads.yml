name: Count downloads

# Keeps the README's downloads badge from going down when release files are replaced or deleted.
# See .github/scripts/download_tally.py. The Windows build also runs it right before it swaps files.
on:
  schedule:
    - cron: '17 * * * *'
  release:
    types: [published]
  push:
    branches: [main]
    paths: ['.github/scripts/download_tally.py', '.github/workflows/downloads.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: download-tally

jobs:
  tally:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update the downloads ledger
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/download_tally.py
