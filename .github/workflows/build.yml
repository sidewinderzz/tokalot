name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

# Needed so tagged builds can publish a GitHub Release (what the in-app updater reads).
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The runner already ships the Android SDK; just add the NDK and CMake we need.
      - name: Install NDK and CMake
        run: |
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      # The signing key is stored as a repo secret (base64). It is never committed.
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.TOKALOT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/tokalot.jks"
            echo "TOKALOT_KEYSTORE=$RUNNER_TEMP/tokalot.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key secret; APK will use a throwaway debug key."
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Test and build release APK
        env:
          TOKALOT_KEYSTORE_PASSWORD: ${{ secrets.TOKALOT_KEYSTORE_PASSWORD }}
        run: gradle testReleaseUnitTest assembleRelease --no-daemon

      # Handy for grabbing a build between releases. Kept briefly to stay under the
      # account's artifact storage quota; a full quota doesn't fail the build.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Tokalot-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 3

      # When main has a version number that hasn't been released yet, publish it.
      # So a release = bump versionName in app/build.gradle.kts and push to main.
      # Skipped until the signing secrets exist, so a release is never signed with a throwaway key.
      - name: Publish release
        if: github.ref == 'refs/heads/main' && env.TOKALOT_KEYSTORE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "v$VERSION is already released; nothing to publish."
            exit 0
          fi
          cp app/build/outputs/apk/release/app-release.apk "Tokalot-v$VERSION.apk"
          gh release create "v$VERSION" "Tokalot-v$VERSION.apk" \
            --target "$GITHUB_SHA" --title "Tokalot $VERSION" --generate-notes
