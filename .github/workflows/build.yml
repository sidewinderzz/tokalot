name: Build APK

on:
  push:
    branches: ['**']
    # The Windows, Linux and Mac apps have their own workflows (windows.yml, linux.yml, mac.yml).
    paths-ignore: ['windows/**', 'linux/**', 'mac/**', '.github/workflows/windows.yml', '.github/workflows/linux.yml', '.github/workflows/mac.yml']
  workflow_dispatch:
    inputs:
      beta:
        description: Also publish this build as the public Android beta
        type: boolean
        default: false

# Needed so tagged builds can publish a GitHub Release (what the in-app updater reads).
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The runner already ships the Android SDK; just add the NDK and CMake we need.
      - name: Install NDK and CMake
        run: |
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      # The signing key is stored as a repo secret (base64). It is never committed.
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.TOKALOT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/tokalot.jks"
            echo "TOKALOT_KEYSTORE=$RUNNER_TEMP/tokalot.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key secret; APK will use a throwaway debug key."
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Test and build release APK
        env:
          TOKALOT_KEYSTORE_PASSWORD: ${{ secrets.TOKALOT_KEYSTORE_PASSWORD }}
        run: gradle testReleaseUnitTest assembleRelease --no-daemon

      # Handy for grabbing a build between releases. Kept briefly to stay under the
      # account's artifact storage quota; a full quota doesn't fail the build.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Tokalot-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 3

      # When main has a version number that hasn't been released yet, publish it.
      # So a release = bump versionName in app/build.gradle.kts and push to main.
      # Skipped until the signing secrets exist, so a release is never signed with a throwaway key.
      - name: Publish release
        if: github.ref == 'refs/heads/main' && env.TOKALOT_KEYSTORE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "v$VERSION is already released; nothing to publish."
            exit 0
          fi
          cp app/build/outputs/apk/release/app-release.apk "Tokalot-v$VERSION.apk"
          # The release text is this version's section of the changelog the app shows
          # (the "## <version>" heading's "- " lines); GitHub's generated notes if there is none.
          awk -v v="$VERSION" '
            /^## / { split(substr($0, 4), h, " "); on = (h[1] == v); next }
            on && /^- / { print }
          ' app/src/main/assets/CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            NOTES=(--notes-file notes.md)
          else
            echo "::warning::No '## $VERSION' section in app/src/main/assets/CHANGELOG.md; using generated notes."
            NOTES=(--generate-notes)
          fi
          gh release create "v$VERSION" "Tokalot-v$VERSION.apk" \
            --target "$GITHUB_SHA" --title "Tokalot $VERSION" "${NOTES[@]}"

      # A public beta, on request: a commit message with [beta] in it (any branch), or a manual run with
      # "beta" ticked. Last, as it rebuilds with a beta version name. It replaces the rolling android-beta pre-release, which never becomes "latest", so
      # only people who turn on Settings > About > Get beta updates are offered it. Its version is
      # <versionName>-beta.<run number>, with the same versionCode, so the release of that version
      # installs over it.
      - name: Publish beta
        if: env.TOKALOT_KEYSTORE != '' && (contains(github.event.head_commit.message, '[beta]') || (github.event_name == 'workflow_dispatch' && inputs.beta))
        env:
          GH_TOKEN: ${{ github.token }}
          TOKALOT_KEYSTORE_PASSWORD: ${{ secrets.TOKALOT_KEYSTORE_PASSWORD }}
        run: |
          BASE=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          BETA="$BASE-beta.$GITHUB_RUN_NUMBER"
          sed -i "s/versionName = \"$BASE\"/versionName = \"$BETA\"/" app/build.gradle.kts
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk Tokalot-beta.apk
          {
            echo "A beta of Tokalot $BASE, built from \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA::7}. Less tested than a release."
            echo
            awk -v v="$BASE" '
              /^## / { split(substr($0, 4), h, " "); on = (h[1] == v); next }
              on && /^- / { print }
            ' app/src/main/assets/CHANGELOG.md
          } > beta-notes.md
          gh release delete "android-beta" --cleanup-tag --yes > /dev/null 2>&1 || true
          gh release create "android-beta" Tokalot-beta.apk --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Tokalot $BETA" --notes-file beta-notes.md
