name: Build Windows app

on:
  push:
    branches: ['**']
    paths: ['windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:

permissions:
  contents: write

# A newer push to the same branch replaces an unfinished build of it. Never on main,
# where a cancelled run could leave a release half-published.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The ARM64 build on a real Windows on ARM machine: it starts and draws every page natively.
  arm64-check:
    runs-on: windows-11-arm
    defaults:
      run:
        shell: bash
        working-directory: windows/Tokalot.Desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: dotnet publish -c Release -r win-arm64 --self-contained -o publish

      - name: Smoke test
        run: |
          uname -m
          # The speech engine (whisper.cpp) must be there in its ARM64 form.
          find publish -iname '*whisper*.dll' | tee engines.txt
          grep -qi arm64 engines.txt || { echo "No ARM64 speech engine in the build"; exit 1; }
          timeout 300 ./publish/Tokalot.exe --screenshots "$RUNNER_TEMP/screenshots" || true
          ls -l "$RUNNER_TEMP/screenshots"
          COUNT=$(ls "$RUNNER_TEMP/screenshots"/*.png | wc -l)
          echo "$COUNT screenshots"
          [ "$COUNT" -ge 10 ]

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Tokalot-windows-arm64-screenshots
          path: ${{ runner.temp }}/screenshots
          retention-days: 3

  build:
    needs: arm64-check
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: windows/Tokalot.Desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read version
        run: |
          VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Tokalot.Desktop.csproj | tr -d '\r')
          [ -n "$VERSION" ] || { echo "No <Version> in the csproj"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building Tokalot for Windows $VERSION"

      # Self-contained: the user doesn't need .NET installed. One build for Intel/AMD PCs and a native
      # one for Windows on ARM (Snapdragon), where the x64 build would run emulated and transcribe slower.
      - name: Publish
        run: |
          dotnet publish -c Release -r win-x64 --self-contained -o publish
          dotnet publish -c Release -r win-arm64 --self-contained -o publish-arm64

      # Velopack turns the app into an installer (TokalotSetup) plus update packages. Each build is its own
      # channel ("win" for x64, as always, and "win-arm64"), so installed copies only ever update to their own kind.
      - name: Package installer
        run: |
          dotnet tool install -g vpk --version 1.2.161
          vpk pack --packId Tokalot --packVersion "$VERSION" --packDir publish --mainExe Tokalot.exe \
            --packTitle Tokalot --packAuthors sidewinderzz --icon Assets/icon.ico --outputDir releases
          vpk pack --packId Tokalot --packVersion "$VERSION" --packDir publish-arm64 --mainExe Tokalot.exe \
            --packTitle Tokalot --packAuthors sidewinderzz --icon Assets/icon.ico --outputDir releases-arm64 \
            --channel win-arm64 --runtime win-arm64
          ls -l releases releases-arm64
          mv releases/*Setup.exe releases/TokalotSetup.exe
          mv releases-arm64/*Setup.exe releases-arm64/TokalotSetup-arm64.exe
          # Both go up to the same release, so no file name may be shared.
          for f in releases-arm64/*; do
            [ ! -e "releases/$(basename "$f")" ] || { echo "Both builds made $(basename "$f")"; exit 1; }
          done
          mv releases-arm64/* releases/

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Tokalot-windows
          path: windows/Tokalot.Desktop/releases/TokalotSetup*.exe
          retention-days: 3

      # Bump <Version> in the .csproj and push to main to release. Desktop releases are tagged
      # desktop-v<version> and never marked "latest", so the Android app's updater and the
      # README's APK link keep pointing at the newest Android release.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="desktop-v$VERSION"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG is already released; nothing to publish."
            exit 0
          fi
          NOTES="Download **TokalotSetup.exe** and run it (on a Windows on ARM PC, such as a Snapdragon laptop, download **TokalotSetup-arm64.exe** instead). Windows may show \"Windows protected your PC\" because the installer isn't code-signed yet: click **More info → Run anyway**. Tokalot then lives in your tray; hold **Ctrl+Win** in any app to dictate. Installed copies update themselves."
          gh release create "$TAG" releases/* --target "$GITHUB_SHA" --latest=false \
            --title "Tokalot for Windows $VERSION" --notes "$NOTES"

          # A rolling "desktop" release always holds the newest build. The app checks it for
          # updates, and the README links to its installer, so neither needs a version number.
          if ! gh release view desktop > /dev/null 2>&1; then
            gh release create desktop --target "$GITHUB_SHA" --latest=false \
              --title "Tokalot for Windows (newest)" --notes "$NOTES"
          fi
          # Installed apps read this release while it is being refreshed, so no file it points at
          # may ever be missing (deleting everything first once made an update check get a 404).
          # A file whose name already exists is uploaded under a temporary name and then swapped in
          # with one rename, so the old copy stays downloadable until the new one is complete. The
          # update packages go first and the feed that names them (releases.win.json, RELEASES)
          # last; only then are leftovers from older builds deleted.
          # Replacing a file throws away its download count, so bank today's counts first.
          GITHUB_TOKEN="$GH_TOKEN" "$(command -v python || command -v python3)" "$GITHUB_WORKSPACE/.github/scripts/download_tally.py" \
            || echo "Couldn't update the downloads ledger; the hourly count will catch up."
          REPO="$GITHUB_REPOSITORY"
          asset_id() {
            gh api "repos/$REPO/releases/tags/desktop" --jq ".assets[] | select(.name == \"$1\") | .id"
          }
          put() {
            local file="$1" name old new
            name=$(basename "$file")
            old=$(asset_id "$name")
            if [ -z "$old" ]; then
              gh release upload desktop "$file"
              return
            fi
            mkdir -p staging
            cp "$file" "staging/next-$name"
            gh release upload desktop "staging/next-$name" --clobber
            new=$(asset_id "next-$name")
            [ -n "$new" ] || { echo "Upload of $name didn't show up"; exit 1; }
            gh api -X DELETE "repos/$REPO/releases/assets/$old"
            gh api -X PATCH "repos/$REPO/releases/assets/$new" -f name="$name" > /dev/null
          }
          FEED="releases.win.json RELEASES releases.win-arm64.json RELEASES-win-arm64"
          for f in releases/*; do
            case " $FEED " in *" $(basename "$f") "*) continue ;; esac
            put "$f"
          done
          for n in $FEED; do
            if [ -f "releases/$n" ]; then put "releases/$n"; fi
          done
          KEEP=$(ls releases)
          for a in $(gh release view desktop --json assets --jq '.assets[].name'); do
            if ! printf '%s\n' $KEEP | grep -qxF "$a"; then
              gh release delete-asset desktop "$a" --yes
            fi
          done
          gh release edit desktop --title "Tokalot for Windows $VERSION (newest)" --notes "$NOTES"
